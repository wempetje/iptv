<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1216">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Thuisdashboard</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon" data-icon="home"></span>
      <h1 id="title">Thuis</h1>
    </div>
    <nav id="tabs" class="tabs" aria-label="Weergave"></nav>
    <div class="topbar-right">
      <span id="conn" class="conn" title="Verbinding met server"></span>
      <time id="clock" class="clock"></time>
    </div>
  </header>

  <main id="main">
    <section id="view-overview" class="view">
      <div id="grid" class="grid"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
